# flowfwd configuration. Options are grouped in [sections] as 'key = value'.
# '#' starts a comment.

[ports]
# DPDK port ids for the forward direction (the startup log shows which PCI device is which).
in_port = 0
out_port = 1

# RX/TX queues per port (1-16). One worker core is used per queue.
queues = 1

[rss]
# 16-bit hex pattern repeated to form the RSS key. A repeating key makes the hash symmetric,
# so both directions of a flow reach the same queue. 0x0000 and 0xffff are rejected.
pattern = 0x6d5a

[logging]
# Log level for flowfwd messages: 0=error, 1=warning, 2=info, 3=debug.
level = 2

# 1 = also print log lines to the console, 0 = only write log.txt.
console = 1

[export]
# Seconds between flow statistics exports (1-3600). Each worker appends to its own
# flow_stats_core_<core_id>.csv in the directory of the binary.
interval = 10

[filter]
# 1 = forward ARP frames (they are not tracked), 0 = drop them like any other non-IP traffic.
# ARP has to pass for the hosts on both sides of the bridge to find each other.
pass_arp = 1
