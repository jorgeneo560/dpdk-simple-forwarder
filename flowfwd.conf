# flowfwd configuration. Options are grouped in [sections] as 'key = value'.
# '#' starts a comment.

[ports]
# DPDK port ids for the forward direction (the startup log shows which PCI device is which).
in_port = 0
out_port = 1

# RX/TX queues per port (1-16). Each queue uses two worker cores: an RX thread and a TX thread.
queues = 4

[rss]
# 16-bit hex pattern repeated to form the RSS key. A repeating key makes the hash symmetric,
# so both directions of a flow reach the same queue. 0x0000 and 0xffff are rejected.
pattern = 0x6d5a

[logging]
# Log level for flowfwd messages: 0=error, 1=warning, 2=info, 3=debug.
level = 2

# 1 = also print log lines to the console, 0 = only write the log file.
console = 1

# File the log is written to (appended). A relative path starts in the directory the
# program is run from; run.sh starts it in the directory of the binary.
file = log.txt

[export]
# Seconds between flow statistics exports (1-3600). Each worker appends to its own
# flow_stats_core_<core_id>.csv in the export directory.
interval = 10

# Directory of the CSV files. A relative path starts in the directory the program is run from.
directory = .

[filter]
# 1 = forward ARP frames (they are not tracked), 0 = drop them like any other non-IP traffic.
# ARP has to pass for the hosts on both sides of the bridge to find each other.
pass_arp = 1

[flows]
# Only TCP flows are tracked. Traffic without a clear end (UDP, ICMP, ...) is forwarded but not tracked.
# Seconds without packets before a flow is removed from the table (1-65535).
timeout = 60

# Seconds between runs of the cleaner that removes the timed-out flows (1-3600).
cleanup_interval = 10

# Flows each worker can track (8-1048576). When a table is full, packets of new flows are dropped
# and counted in drops= until the cleaner frees room. Each flow needs roughly 100 bytes of hugepage
# memory per worker.
table_size = 65536

[rewrite]
# Destination MAC written into the IP packets that are forwarded, as aa:bb:cc:dd:ee:ff. It is the MAC
# of the next device on the link the packets leave through. ARP is never changed. A line left out
# (or commented, as below) means the packets of that direction are forwarded unchanged.
# forward_dst_mac = 00:11:22:33:44:55    # packets going from the input port to the output port
# reverse_dst_mac = 00:11:22:33:44:66    # packets going from the output port to the input port
